# A first workflow to play around with the editor
name: My First Workflow
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  Test:
    runs-on: ubuntu-latest
    environment: Test
    needs: first_job
    steps:
      - run: |
          echo "Pozdrowienia dla ${{ vars.WHO_TO_GREET }} od ${{github.actor}}."
          sec=$(echo ${{secrets.MY_SECRET}} | sed 's/./& /g')
          echo "Moje hasło zamaskowane to '$sec'."
  Load-Test:
    runs-on: ubuntu-latest
    environment: Load-Test
    needs: first_job
    steps:
      - run: |
          echo "Pozdrowienia dla ${{ vars.WHO_TO_GREET }} od ${{github.actor}}."
          sec=$(echo ${{secrets.MY_SECRET}} | sed 's/./& /g')
          echo "Moje hasło zamaskowane to '$sec'."
  Production:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://writeabout.net
    needs: [Test, Load-Test]
    steps:
      - run: |
          echo "Pozdrowienia dla ${{ vars.WHO_TO_GREET }} od ${{github.actor}}."
          sec=$(echo ${{secrets.MY_SECRET}} | sed 's/./& /g')
          echo "Moje hasło zamaskowane to '$sec'."
  first_job:
    name: Moje pierwsze zadanie
    runs-on: ubuntu-latest
    steps:
      - name: Pozdrów użytkownika
        run: |
            echo "Witaj, ${{vars.WHO_TO_GREET}} od ${{ github.actor }}"
            echo "Moje zamaskowane hasło to ${{secrets.MY_SECRET}}"
        shell: bash
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - run: tree
        
